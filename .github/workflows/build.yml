name: Build Slither PSP

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile
        run: make

      - name: Upload game
        uses: actions/upload-artifact@v4
        with:
          name: slither-psp-homebrew
          path: EBOOT.PBP
